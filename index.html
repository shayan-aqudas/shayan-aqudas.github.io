<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nooraya — Luxury Islamic Companion | By Shayan Aqudas</title>
    <meta name="description" content="Nooraya: Holy Quran, Audio Recitations, Prayer Times, Hadith, Qibla and Tasbih. Crafted by Shayan Aqudas.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #071710;
            --bg-emerald: #112A1E;
            --bg-card: rgba(20, 48, 34, 0.55);
            --gold-primary: #C6A96B;
            --gold-bright: #E5C887;
            --gold-dark: #9B7E42;
            --ivory: #F7F5EF;
            --text-muted: #A3B8AC;
            --border-gold: rgba(198, 169, 107, 0.22);
            --border-glow: rgba(198, 169, 107, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-deep);
            color: var(--ivory);
            line-height: 1.65;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 10%, rgba(26, 67, 20, 0.55) 0%, transparent 45%),
                radial-gradient(circle at 85% 30%, rgba(198, 169, 107, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 50% 90%, rgba(17, 42, 30, 0.8) 0%, transparent 50%);
        }

        /* Subtle Islamic Geometric Pattern Overlay */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: radial-gradient(var(--gold-primary) 0.6px, transparent 0.6px);
            background-size: 32px 32px;
            opacity: 0.06;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            position: relative;
            z-index: 1;
        }

        /* Floating Luxury Navbar */
        .nav-wrapper {
            position: fixed;
            top: 18px;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 0 16px;
        }

        nav {
            max-width: 1120px;
            margin: 0 auto;
            background: rgba(9, 26, 18, 0.78);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--border-gold);
            border-radius: 100px;
            padding: 14px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.45);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-mark {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            background: linear-gradient(135deg, var(--gold-bright), var(--gold-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bg-deep);
            font-family: 'Amiri', serif;
            font-weight: 700;
            font-size: 1.3rem;
            box-shadow: 0 4px 15px rgba(198, 169, 107, 0.35);
        }

        .logo-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.55rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--ivory);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.92rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--gold-bright);
        }

        .nav-cta {
            background: linear-gradient(135deg, var(--gold-bright) 0%, var(--gold-primary) 100%);
            color: #071710 !important;
            padding: 10px 22px;
            border-radius: 50px;
            font-weight: 700 !important;
            font-size: 0.88rem !important;
            box-shadow: 0 4px 18px rgba(198, 169, 107, 0.3);
            transition: transform 0.25s ease, box-shadow 0.25s ease !important;
        }

        .nav-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(198, 169, 107, 0.45);
        }

        /* Hero Section */
        .hero {
            padding: 150px 0 90px;
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 56px;
            align-items: center;
        }

        .bismillah {
            font-family: 'Amiri', serif;
            font-size: 1.75rem;
            color: var(--gold-primary);
            margin-bottom: 14px;
            letter-spacing: 1px;
            opacity: 0.95;
        }

        .pill-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(198, 169, 107, 0.1);
            border: 1px solid var(--border-gold);
            color: var(--gold-bright);
            padding: 7px 16px;
            border-radius: 100px;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-bottom: 22px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 10px #4ade80;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.25); }
        }

        .hero h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.7rem, 5.2vw, 4.4rem);
            line-height: 1.08;
            font-weight: 700;
            margin-bottom: 22px;
            color: var(--ivory);
        }

        .gold-gradient-text {
            background: linear-gradient(135deg, #FFF3D1 0%, var(--gold-primary) 55%, #9B7E42 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-style: italic;
        }

        .hero-desc {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 540px;
            margin-bottom: 36px;
            font-weight: 400;
        }

        .hero-buttons {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 42px;
        }

        .btn-gold {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, var(--gold-bright) 0%, var(--gold-primary) 50%, var(--gold-dark) 100%);
            color: #071710;
            padding: 16px 32px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            box-shadow: 0 12px 30px rgba(198, 169, 107, 0.28);
            transition: all 0.3s ease;
        }

        .btn-gold:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 38px rgba(198, 169, 107, 0.42);
        }

        .btn-glass {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-gold);
            color: var(--ivory);
            padding: 16px 28px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-glass:hover {
            background: rgba(198, 169, 107, 0.12);
            border-color: var(--gold-bright);
            transform: translateY(-3px);
        }

        .hero-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding-top: 28px;
            border-top: 1px solid rgba(198, 169, 107, 0.16);
            max-width: 500px;
        }

        .stat-item h4 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            color: var(--gold-bright);
            line-height: 1.1;
        }

        .stat-item p {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-top: 4px;
        }

        /* 3D Luxury Phone Mockup */
        .mockup-container {
            display: flex;
            justify-content: center;
            position: relative;
        }

        .glow-ring {
            position: absolute;
            width: 340px;
            height: 340px;
            background: radial-gradient(circle, rgba(198, 169, 107, 0.28) 0%, transparent 70%);
            filter: blur(35px);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
        }

        .phone-frame {
            width: 310px;
            background: linear-gradient(160deg, #1b3d2b 0%, #07150e 100%);
            border: 2px solid rgba(198, 169, 107, 0.45);
            border-radius: 44px;
            padding: 14px;
            box-shadow: 
                0 30px 70px rgba(0, 0, 0, 0.7),
                inset 0 0 22px rgba(198, 169, 107, 0.15);
            position: relative;
            z-index: 2;
            animation: floatPhone 5s ease-in-out infinite;
        }

        @keyframes floatPhone {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }

        .phone-screen {
            background: linear-gradient(180deg, #0d261a 0%, #07140d 100%);
            border-radius: 32px;
            padding: 22px 18px;
            border: 1px solid rgba(198, 169, 107, 0.18);
        }

        .phone-notch {
            width: 85px;
            height: 6px;
            background: rgba(198, 169, 107, 0.25);
            border-radius: 10px;
            margin: 0 auto 18px;
        }

        .app-ui-header {
            text-align: center;
            margin-bottom: 18px;
        }

        .app-ui-header span {
            font-size: 0.72rem;
            color: var(--gold-primary);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .app-ui-header h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            color: var(--ivory);
        }

        .prayer-widget {
            background: linear-gradient(135deg, rgba(198, 169, 107, 0.2), rgba(20, 52, 36, 0.8));
            border: 1px solid rgba(198, 169, 107, 0.35);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 14px;
            text-align: center;
        }

        .prayer-widget .next-label {
            font-size: 0.72rem;
            color: var(--gold-bright);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .prayer-widget .prayer-time {
            font-size: 1.65rem;
            font-weight: 700;
            color: var(--ivory);
            margin: 4px 0;
        }

        .prayer-widget .ayah-ar {
            font-family: 'Amiri', serif;
            font-size: 1.1rem;
            color: var(--gold-bright);
            margin-top: 6px;
        }

        .mini-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }

        .mini-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(198, 169, 107, 0.16);
            border-radius: 14px;
            padding: 12px 10px;
            text-align: center;
        }

        .mini-box .icon {
            font-size: 1.25rem;
            margin-bottom: 4px;
        }

        .mini-box p {
            font-size: 0.76rem;
            font-weight: 600;
            color: var(--ivory);
        }

        .mini-box small {
            font-size: 0.65rem;
            color: var(--text-muted);
        }

        .audio-bar {
            background: rgba(198, 169, 107, 0.12);
            border: 1px solid rgba(198, 169, 107, 0.25);
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.78rem;
        }

        .play-circle {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--gold-primary);
            color: var(--bg-deep);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* Section Headings */
        .section-header {
            text-align: center;
            max-width: 680px;
            margin: 0 auto 56px;
        }

        .section-tag {
            color: var(--gold-primary);
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            display: block;
            margin-bottom: 10px;
        }

        .section-header h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2rem, 4vw, 3rem);
            color: var(--ivory);
            margin-bottom: 14px;
        }

        .section-header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Bento Luxury Features Grid */
        .features-section {
            padding: 90px 0;
        }

        .bento-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .bento-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-gold);
            border-radius: 24px;
            padding: 34px 28px;
            transition: all 0.35s ease;
            position: relative;
            overflow: hidden;
        }

        .bento-card::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .bento-card:hover {
            transform: translateY(-6px);
            border-color: var(--border-glow);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
        }

        .bento-card:hover::after {
            opacity: 1;
        }

        .bento-wide {
            grid-column: span 2;
            background: linear-gradient(135deg, rgba(26, 67, 20, 0.55), rgba(14, 36, 25, 0.8));
        }

        .feature-icon {
            width: 54px;
            height: 54px;
            border-radius: 16px;
            background: rgba(198, 169, 107, 0.14);
            border: 1px solid rgba(198, 169, 107, 0.32);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 22px;
            color: var(--gold-bright);
        }

        .bento-card h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.55rem;
            color: var(--ivory);
            margin-bottom: 10px;
        }

        .bento-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Developer & Studio Spotlight */
        .studio-section {
            padding: 70px 0 90px;
        }

        .studio-card {
            background: linear-gradient(135deg, rgba(22, 56, 39, 0.85) 0%, rgba(8, 23, 16, 0.95) 100%);
            border: 1px solid rgba(198, 169, 107, 0.38);
            border-radius: 32px;
            padding: 56px 48px;
            display: grid;
            grid-template-columns: 1.3fr 0.7fr;
            gap: 40px;
            align-items: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        }

        .studio-card h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2rem, 3.6vw, 2.75rem);
            color: var(--ivory);
            margin-bottom: 14px;
        }

        .studio-card p {
            color: var(--text-muted);
            margin-bottom: 24px;
            font-size: 1.02rem;
        }

        .skill-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 28px;
        }

        .skill-tag {
            background: rgba(198, 169, 107, 0.12);
            border: 1px solid rgba(198, 169, 107, 0.28);
            color: var(--gold-bright);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .contact-box {
            background: rgba(7, 23, 16, 0.75);
            border: 1px solid var(--border-gold);
            border-radius: 24px;
            padding: 32px;
            text-align: center;
        }

        .avatar-ring {
            width: 74px;
            height: 74px;
            border-radius: 50%;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, var(--gold-bright), var(--gold-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.9rem;
            font-weight: 700;
            color: var(--bg-deep);
            box-shadow: 0 10px 25px rgba(198, 169, 107, 0.3);
        }

        .contact-box h4 {
            font-size: 1.2rem;
            color: var(--ivory);
            margin-bottom: 4px;
        }

        .contact-box span {
            font-size: 0.85rem;
            color: var(--gold-primary);
            display: block;
            margin-bottom: 20px;
        }

        /* FAQ Accordion */
        .faq-section {
            padding: 40px 0 90px;
            max-width: 820px;
            margin: 0 auto;
        }

        details {
            background: var(--bg-card);
            border: 1px solid var(--border-gold);
            border-radius: 18px;
            padding: 20px 24px;
            margin-bottom: 16px;
            transition: border-color 0.3s ease;
        }

        details[open] {
            border-color: var(--gold-primary);
        }

        summary {
            font-weight: 600;
            font-size: 1.05rem;
            color: var(--ivory);
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        summary::-webkit-details-marker {
            display: none;
        }

        summary::after {
            content: "+";
            font-size: 1.4rem;
            color: var(--gold-primary);
            transition: transform 0.25s ease;
        }

        details[open] summary::after {
            transform: rotate(45deg);
        }

        details p {
            color: var(--text-muted);
            font-size: 0.94
